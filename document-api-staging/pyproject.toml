[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-assistant"
version = "0.1.0"
description = "Offline document Q&A with Microsoft Foundry Local and SQLite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pypdf>=5.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.34,<1.0",
  "foundry-local-sdk-winml>=1.0; platform_system == 'Windows'",
  "foundry-local-sdk>=1.0; platform_system != 'Windows'",
]

[project.scripts]
local-rag = "local_rag.cli:main"
local-rag-api = "local_rag.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
